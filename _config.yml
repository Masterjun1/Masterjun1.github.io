# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
# TODO: 改成你自己的博客名 / 昵称 / GitHub 用户名
title: SecNotes
subtitle: 渗透测试与网络安全笔记
description: 记录渗透测试、内网攻防、CTF、免杀绕过、代码审计与安全工具的学习笔记
keywords: 渗透测试,网络安全,红队,CTF,免杀,代码审计,内网渗透
author: Masterjun1
language: zh-CN
timezone: Asia/Shanghai

# URL
## TODO: 部署前把 your-username 改成你的 GitHub 用户名
url: https://Masterjun1.github.io
permalink: posts/:abbrlink/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: false
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: 未分类
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: butterfly

# 短链接（替代带中文的超长 URL）
abbrlink:
  alg: crc32
  rep: hex

# 本地搜索
search:
  path: search.xml
  field: post
  content: true
  format: html

# RSS 订阅
feed:
  enable: true
  type:
    - atom
    - rss2
  path:
    - atom.xml
    - rss2.xml
  limit: 20
  hub:
  content: true
  content_limit: 140
  content_limit_delim: ' '
  order_by: -date

# 文章加密（在文章 front-matter 里加 password: xxx 即可）
encrypt:
  enable: true
  default_abstract: 该内容已加密，输入密码后查看
  default_message: 请输入访问密码

# Deployment
## TODO: 把 your-username 改成你的 GitHub 用户名后执行 hexo d
deploy:
  type: git
  repo: https://github.com/Masterjun1/Masterjun1.github.io.git
  branch: gh-pages
